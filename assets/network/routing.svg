<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1770" viewBox="0 0 2000 1770" role="img" aria-labelledby="title desc"><title id="title">本机部署示例（2026-10-25快照）：Clash分流规则</title><desc id="desc">本机部署示例（2026-10-25快照），不是通用安装拓扑；真实节点与策略在私有配置中，不随源码分发。2026-10-25实时策略。专用Edge和原生CLI先完整预检，再通过17897绑定具体US节点，不经过普通规则表。普通7897和TUN流量依次经过1至106条规则，首次命中结束；106为MATCH,DIRECT，107起订阅规则当前不可达。固定组保留US HTTP、US SS2022与JP SOCKS5，当前仅US HTTP匹配严格US基线与IP锁。真实地址、节点私名及凭据隐藏。</desc><rect width="2000" height="1770" fill="white" /><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="50" y="75" text-anchor="start" font-size="41" font-weight="600" fill="#17324F">本机部署示例：专用入口固定，普通流量按序分流</text>

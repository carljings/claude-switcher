<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1460" viewBox="0 0 2000 1460" role="img" aria-labelledby="title desc"><title id="title">本机部署示例（2026-10-25快照）：AI网络总览</title><desc id="desc">本机部署示例（2026-10-25快照），不是通用安装拓扑；真实节点与策略在私有配置中，不随源码分发。沿用旧图四列布局。专用Edge与专用原生CLI改用17897绑定当前具体美国HTTP出口；普通应用经7897或TUN按规则分流。固定出口仍通过Trojan机场前置。保留美国Shadowsocks备用和日本SOCKS5备用。VPS本机双账号为历史结构，本轮未远程核验。</desc><rect width="2000" height="1460" fill="white" /><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="50" y="75" text-anchor="start" font-size="41" font-weight="600" fill="#17324F">本机部署示例：AI 网络总览与固定出口</text>
<text x="50" y="122" text-anchor="start" font-size="25" font-weight="400" fill="#60758B">2026-10-25 快照 · 脱敏示例，三节点与 VPS 不是所有用户的安装默认，也不随源码分发</text>
<rect x="50" y="155" width="1900" height="60" rx="12" fill="#EEF6FC" stroke="none" stroke-width="2" />
<text x="1000" y="194" text-anchor="middle" font-size="25" font-weight="400" fill="#176FA7">2026-10-25 · 机场前置当前为 Trojan · 美国①匹配单IP锁 · Chicago / en-US · 地址与凭据隐藏</text>
<rect x="50" y="255" width="460" height="640" rx="24" fill="#F1F6FC" stroke="#CCDDEC" stroke-width="2" />
<rect x="590" y="255" width="300" height="640" rx="24" fill="#F4F0FA" stroke="#D9CEE9" stroke-width="2" />

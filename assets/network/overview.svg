<text x="1035" y="772" text-anchor="start" font-size="21" font-weight="400" fill="#176FA7">保留备用，当前未选中</text>
<text x="995" y="839" text-anchor="start" font-size="22" font-weight="400" fill="#60758B">改选其他节点需重核 IP锁 / 国家</text>
<text x="995" y="873" text-anchor="start" font-size="22" font-weight="400" fill="#60758B">不等于可直接沿用当前严格许可</text>
<polyline points="865,765 930,765 930,545 1015,545" fill="none" stroke="#176FA7" stroke-width="4" stroke-linejoin="round" />
<polygon points="1015.0,545.0 1003.0,539.0 1003.0,551.0" fill="#176FA7" />
<text x="930" y="740" text-anchor="middle" font-size="19" font-weight="400" fill="#176FA7">连接</text>
<text x="1565" y="365" text-anchor="start" font-size="28" font-weight="600" fill="#176FA7">Claude / OpenAI</text>
<text x="1565" y="412" text-anchor="start" font-size="23" font-weight="400" fill="#60758B">IPPure / Ping0 / 检测接口</text>
<text x="1565" y="459" text-anchor="start" font-size="23" font-weight="400" fill="#60758B">专用实例访问的其他目标</text>

<text x="1035" y="672" text-anchor="start" font-size="21" font-weight="400" fill="#176FA7">既有 VPS 代理 · 备用</text>
<rect x="1015" y="710" width="400" height="80" rx="10" fill="#EDF4FA" stroke="none" stroke-width="2" />

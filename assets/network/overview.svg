<text x="80" y="1232" text-anchor="start" font-size="23" font-weight="400" fill="#60758B">Mac 的美国②节点沿用既有 VPS 配置；VPS 当前服务、双账号状态与出站，本轮未远程复核。</text>
<text x="50" y="1323" text-anchor="start" font-size="24" font-weight="400" fill="#60758B">普通连接先按前置共享域名规则；其余有效白名单走机场；未命中再 DIRECT，内网也按实际顺序判断。</text>
<text x="50" y="1368" text-anchor="start" font-size="24" font-weight="400" fill="#60758B">专用 Edge / CLI 使用 17897；普通应用通过 7897 / TUN 按顺序匹配，实际优先级见第二张图。</text>
<text x="50" y="1413" text-anchor="start" font-size="23" font-weight="400" fill="#60758B">仅本机脱敏快照；真实节点与策略保留在私有配置中，不作为其他设备已部署的证明。</text></g></svg>

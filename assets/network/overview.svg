<rect x="1540" y="255" width="410" height="640" rx="24" fill="#F7F7FB" stroke="#D8DAE6" stroke-width="2" />
<text x="75" y="301" text-anchor="start" font-size="29" font-weight="600" fill="#17324F">01  本地 Mac</text>
<text x="615" y="301" text-anchor="start" font-size="29" font-weight="600" fill="#17324F">02  机场中转</text>
<text x="995" y="301" text-anchor="start" font-size="29" font-weight="600" fill="#17324F">03  固定出口</text>
<text x="1565" y="301" text-anchor="start" font-size="29" font-weight="600" fill="#17324F">04  目标服务</text>
<rect x="75" y="340" width="410" height="140" rx="18" fill="white" stroke="#D2DFEB" stroke-width="2" />
<text x="100" y="381" text-anchor="start" font-size="25" font-weight="600" fill="#17324F">专用 Edge / 专用原生 CLI</text>
<text x="100" y="425" text-anchor="start" font-size="23" font-weight="400" fill="#176FA7">17897 · 固定具体 HTTP 节点</text>
<text x="100" y="461" text-anchor="start" font-size="22" font-weight="400" fill="#60758B">先核对基线、IP锁与实际路由</text>
